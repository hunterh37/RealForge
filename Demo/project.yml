name: RealityHDDemo
options:
  bundleIdPrefix: io.medvr.realityhd
  deploymentTarget:
    visionOS: "26.0"
  createIntermediateGroups: true
packages:
  RealityHD:
    path: ..
targets:
  RealityHDDemo:
    type: application
    platform: visionOS
    sources: [RealityHDDemo]
    dependencies:
      - package: RealityHD
        product: RealityHD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.medvr.realityhd.demo
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RealityHD
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "7"
    info:
      path: RealityHDDemo/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UISceneSessionRoleImmersiveSpaceApplication:
              - UISceneInitialImmersionStyle: UIImmersionStyleFull
